<!DOCTYPE html>
<html lang="ja">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>支払予定管理システム Ver1.3</title>

    <style>

        body{

            background:#eaf4ff;

            font-family:Arial, sans-serif;

            margin:40px;
        }

        .card{

            background:white;

            padding:20px;

            margin-bottom:20px;

            border-radius:10px;

            box-shadow:0 0 10px #cccccc;
        }

        #mainApp{

            display:none;
        }

        input{

            padding:8px;

            width:250px;
        }

        button{

            background:#003366;

            color:white;

            border:none;

            padding:10px 20px;

            border-radius:5px;

            cursor:pointer;
        }

        button:hover{

            background:#0055aa;
        }

    </style>
</head>

<body>

<div id="loginArea" class="card">

    <h2>🔐 ログイン</h2>

    <input
        type="text"
        id="username"
        placeholder="ユーザー名">

    <br><br>

    <input
        type="password"
        id="password"
        placeholder="パスワード">

    <br><br>

    <label>

        <input
            type="checkbox"
            onclick="togglePassword()">

        パスワード表示

    </label>

    <br><br>

    <button onclick="login()">

        ログイン

    </button>

</div>

<div id="mainApp">

    <div class="card">

        <p id="userInfo"></p>

        <button onclick="logout()">

            ログアウト

        </button>

    </div>

    <!-- ここに既存の支払予定管理システムを配置 -->

</div>

<script src="app.js">

    window.onload = function(){

        if(

            localStorage.getItem(
                "login"
            ) === "true"

        ){

            showMainApp();

        }
    };

    function login(){

        let username =

            document.getElementById(
                "username"
            ).value;

        let password =

            document.getElementById(
                "password"
            ).value;

        if(

            username === "admin"

            &&

            password === "1234"

        ){

            localStorage.setItem(
                "login",
                "true"
            );

            localStorage.setItem(
                "username",
                 username
            );

            showMainApp();

        }

        else{

            alert(
                "ログイン失敗"
            );
        }
    }

    function showMainApp(){

        document.getElementById(
            "loginArea"
        ).style.display =
            "none";

        document.getElementById(
            "mainApp"
        ).style.display =
            "block";

        document.getElementById(
            "userInfo"
        ).innerHTML =

            "👤 ログイン中 : "

            +

            localStorage.getItem(
                "username"
            );
    }

    function logout(){

        localStorage.removeItem(
            "login"
        );

        localStorage.removeItem(
            "username"
        );

        document.getElementById(
            "loginArea"
        ).style.display =
            "block";

        document.getElementById(
            "mainApp"
        ).style.display =
            "none";

        document.getElementById(
            "username"
        ).value = "";

        document.getElementById(
            "password"
        ).value = "";
    }

    function togglePassword(){

        let password =

            document.getElementById(
                "password"
            );

        if(

            password.type ===
            "password"

        ){

            password.type =
                "text";
        }

        else{

            password.type =
                "password";
        }
    }

</script>

</body>

</html>
