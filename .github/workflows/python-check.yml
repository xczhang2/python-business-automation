name: Python Check

on:
  push:
    branches:
      - main

jobs:
  check:

    runs-on: ubuntu-latest

    steps:

    - name: コード取得
      uses: actions/checkout@v4

    - name: Python準備
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Python確認
      run: python --version
