<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>宇宙67 Portfolio</title>

    <style>

        body {
            background-color: #eaf4ff;
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #003366;
        }

        h2 {
            color: green;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px #cccccc;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.02);
        }

        .btn {
            display: inline-block;
            background: #003366;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }

        .btn:hover {
            background: #0055aa;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #cccccc;
            padding: 10px;
        }

        th {
            background-color: #f0f0f0;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: #666666;
        }

    </style>
</head>

<body>

<div class="container">

    <input
    type="text"
    id="search"
    placeholder="取引先検索">

    <button onclick="searchPayment()">
    検索
    </button>

    <button onclick="highAmount()">

    10万円以上

    </button>

    <button onclick="showAll()">

    全件表示

    </button>

    <table>

    <thead>

    <tr>

    <th>取引先</th>

    <th>支払額</th>

    </tr>

    </thead>

    <tbody id="paymentTable">

    </tbody>

    </table>
    
    <button onclick="profile()">

    自己紹介を見る

    </button>

    <p id="skill">
    未表示
    </p>

    <button onclick="showSkill()">

    スキル表示

    </button>

    <div class="card">
        <h2>作成したツール</h2>

        <ul>
            <li>AP管理ツール</li>
            <li>支払予定表作成ツール</li>
            <li>AI経理業務アシスタント</li>
            <li>Excel自動化ツール</li>
            <li>売上分析ダッシュボード</li>
        </ul>
    </div>


    <div class="card">
        <h2>スキルレベル</h2>

        <table>

            <tr>
                <th>技術</th>
                <th>レベル</th>
            </tr>

            <tr>
                <td>Python</td>
                <td>初級〜中級</td>
            </tr>

            <tr>
                <td>SQL</td>
                <td>初級〜中級</td>
            </tr>

            <tr>
                <td>Git/GitHub</td>
                <td>初級</td>
            </tr>

            <tr>
                <td>Streamlit</td>
                <td>初級</td>
            </tr>

        </table>
    </div>


    <div class="card">
        <h2>今後の学習</h2>

        <ul>
            <li>Power Automate</li>
            <li>Azure OpenAI</li>
            <li>LangChain</li>
            <li>AI Agent</li>
        </ul>
    </div>


    <div class="card">

        <h2>GitHub</h2>

        <a href="https://github.com/xczhang2"
           class="btn"
           target="_blank">

            GitHubプロフィール

        </a>

    </div>


    <footer>

        <p>
            © 2026 宇宙67 Portfolio
        </p>

    </footer>

</div>

</body>
<script>

function hello() {

    alert("こんにちは！");

}

function profile() {

    alert("本社勤務 / Python学習中");

}

function changeMessage() {

    document.getElementById(
        "message"
    ).innerHTML =
    "ありがとうございます！";

}

function showSkill() {

    document.getElementById(
        "skill"
    ).innerHTML =
    "Python / SQL / Git";

}

function greet() {

    let name =
        document.getElementById("name").value;

    document.getElementById(
        "result"
    ).innerHTML =
    "こんにちは " + name + " さん";

}

let tasks = [];

window.onload =
function() {

    loadTasks();

};

function addTask() {

    let task =
        document.getElementById(
            "task"
        ).value;

    if(task == "") {

        return;

    }

    tasks.push(task);

    saveTasks();

    showTasks();

    document.getElementById(
        "task"
    ).value = "";
}

function saveTasks() {

    localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
    );
}

function loadTasks() {

    tasks =
        JSON.parse(
            localStorage.getItem(
                "tasks"
            )
        ) || [];

    showTasks();
}

function showTasks() {

    let html = "";

    for(let task of tasks) {

        html +=
            "<li>" +
            task +
            "</li>";
    }

    document.getElementById(
        "taskList"
    ).innerHTML = html;
}

function clearTasks() {

    tasks = [];

    saveTasks();

    showTasks();
}

let payments = [];

function addPayment() {

    let vendor =
        document.getElementById(
            "vendor"
        ).value;

    let amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        );

    payments.push({

        vendor: vendor,

        amount: amount

    });

    showPayments();

}

function showPayments() {

    let html = "";

    for(let payment of payments) {

        html += `
        <tr>

            <td>${payment.vendor}</td>

            <td>
            ${payment.amount.toLocaleString()}
            </td>

        </tr>
        `;
    }

    document.getElementById(
        "paymentTable"
    ).innerHTML = html;
    
    let total = 0;

    for(let payment of payments) {

        total += payment.amount;

    }

    document.getElementById(
        "total"
    ).innerHTML =

    "合計：" +
    total.toLocaleString() +
    "円";

    document.getElementById(
        "count"
    ).innerHTML =

    "件数：" +
    payments.length +
    "件";

}

    let payments = [

    {
        vendor:"A社",
        amount:100000
    },

    {
        vendor:"B社",
        amount:200000
    },

    {
        vendor:"C社",
        amount:50000
    }

    ];

    function searchPayment() {

        let keyword =
            document.getElementById(
               "search"
            ).value;

        let result =
            payments.filter(
                payment =>
                payment.vendor.includes(
                    keyword
                )
            );

        showPayments(result);
    }

    function showPayments(list) {

        let html = "";

    if(result.length == 0) {

        html =
          "<tr><td colspan='2'>"
          +
          "該当なし"
          +
          "</td></tr>";
    }

        for(let payment of list) {

            html += `
            <tr>

                <td>${payment.vendor}</td>

                <td>
                  ${payment.amount
                    .toLocaleString()}
                </td>

            </tr>
            `;
        }

        document.getElementById(
            "paymentTable"
        ).innerHTML = html;
    }

    function highAmount() {

        let result =
            payments.filter(
                payment =>
                payment.amount >= 100000
            );

        showPayments(result);
    }

    function showAll() {

        showPayments(
            payments
        );

    }

</script>
</html>
